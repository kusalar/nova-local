[package]
name = "nova-desktop"
version = "1.0.0"
description = "NOVA — Neural Operational Virtual Assistant"
authors = ["NOVA Core Architect"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "shell-open", "http-all" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
